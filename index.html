<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tienes una sorpresa</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{color-scheme:dark;--gold:#f1c27d;--txt:#fff4e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--txt);font-family:"Playfair Display",Georgia,serif;overflow-x:hidden;background:radial-gradient(ellipse at 50% 0%,#8a1020,#6b0a14 50%,#3d0610);background-attachment:fixed}
#snow{position:fixed;inset:0;pointer-events:none;z-index:3}
main{position:relative;z-index:1;max-width:420px;margin:0 auto;padding:36px 20px 40px;text-align:center;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{font:400 3rem "Great Vibes","Brush Script MT",cursive;color:var(--gold);margin:0;line-height:1.1;text-shadow:0 2px 6px rgba(0,0,0,.4)}
p{line-height:1.5;margin:8px 0 0;font-size:1.1rem;color:#f7d9d0}
.gift{width:190px;height:auto;margin:18px 0 8px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
@keyframes bob{50%{transform:translateY(-10px) rotate(-2deg)}}
.btn{display:inline-block;margin-top:18px;background:linear-gradient(#f6d98b,#e0a94f);color:#4a0a14;text-decoration:none;font:700 1.1rem "Playfair Display",Georgia,serif;padding:14px 32px;border-radius:99px;box-shadow:0 6px 16px rgba(0,0,0,.4),0 0 0 3px rgba(246,217,139,.35);animation:pulse 2s infinite}
.btn:active{transform:scale(.96)}
.btn.locked{background:#8a6a55;color:#f5e6d6;animation:none;box-shadow:none;cursor:not-allowed;opacity:.9}
@keyframes pulse{50%{box-shadow:0 6px 16px rgba(0,0,0,.4),0 0 0 9px rgba(246,217,139,.2)}}
.small{font-size:.9rem;opacity:.8;margin-top:22px}
.locks{display:flex;gap:14px;justify-content:center;font-size:2rem;margin:14px 0 6px}
.q{font-size:1.1rem;margin:8px 0 12px;min-height:3em}
#ans{width:100%;max-width:300px;padding:12px 16px;border-radius:99px;border:2px solid var(--gold);background:#3d0610;color:var(--txt);font:1rem "Playfair Display",Georgia,serif;text-align:center;outline:none}
.row{display:flex;gap:10px;justify-content:center;margin-top:12px}
.b2{background:var(--gold);color:#4a0a14;border:0;border-radius:99px;padding:10px 22px;font:700 1rem "Playfair Display",Georgia,serif;cursor:pointer}
.b2.g{background:transparent;color:var(--gold);border:2px solid var(--gold)}
.fb{min-height:1.6em;margin-top:10px;font-size:.95rem;color:#f7d9d0}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#qrv{display:none}
.card{background:#fff;border-radius:18px;padding:18px;margin:20px 0 6px;box-shadow:0 10px 24px rgba(0,0,0,.45)}
#qr{width:230px;height:230px;margin:0 auto}
#qr img,#qr canvas{max-width:100%;height:auto}
.url{font:.8rem system-ui,sans-serif;word-break:break-all;color:#f7d9d0;opacity:.8}
body.qrmode #inv{display:none}
body.qrmode #qrv{display:block}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<main>
  <div id="inv">
    <h1>Tienes una sorpresa</h1>
    <p id="para"></p>
    <svg class="gift" viewBox="0 0 160 160" aria-hidden="true">
      <rect x="22" y="70" width="116" height="80" rx="6" fill="#1f7a4d"/>
      <rect x="74" y="70" width="12" height="80" fill="#f6d98b"/>
      <rect x="14" y="52" width="132" height="26" rx="6" fill="#2a9461"/>
      <rect x="74" y="52" width="12" height="26" fill="#f6d98b"/>
      <ellipse cx="62" cy="40" rx="24" ry="14" transform="rotate(-25 62 40)" fill="#c8102e" stroke="#7a0a1a" stroke-width="2"/>
      <ellipse cx="98" cy="40" rx="24" ry="14" transform="rotate(25 98 40)" fill="#c8102e" stroke="#7a0a1a" stroke-width="2"/>
      <circle cx="80" cy="46" r="9" fill="#e5484d" stroke="#7a0a1a" stroke-width="2"/>
    </svg>
    <p>Una Navidad especial y cada día una sorpresa.</p>
    <a class="btn" id="go" target="_blank" rel="noopener">Abrir mi calendario 🎁</a>
    <div class="fb" id="fb"></div>
    
  </div>
  <div id="qrv">
    <h1>Tu sorpresa te espera</h1>
    <p>Escanea con la cámara del móvil</p>
    <div class="card"><div id="qr"></div></div>
    <div class="url" id="u"></div>
  </div>
</main>
<script>
// ====== PERSONALIZA AQUÍ ======
var NOMBRE = "mi amor";
var CALENDARIO = "https://claude.ai/artifact/VHXNHSiHpYoJRSi5M3Vanw";
var INVITACION = "https://claude.ai/artifact/W7V2PwvE3gBk8PrZEfnW99";

// ===============================
document.getElementById("para").textContent = "Para ti, " + NOMBRE + ".";
var $ = function(id){ return document.getElementById(id); };
var APERTURA = new Date(new Date().getFullYear(), 11, 1);
function paintGo(){
  var open = location.hash === "#preview" || new Date() >= APERTURA;
  var go = $("go");
  if (open){ go.href = CALENDARIO; go.textContent = "Abrir mi calendario 🎁"; go.classList.remove("locked"); $("fb").textContent = ""; }
  else {
    go.removeAttribute("href"); go.textContent = "Se abre el 1 de diciembre 🔒"; go.classList.add("locked");
    var dias = Math.ceil((APERTURA - new Date()) / 86400000);
    $("fb").textContent = dias === 1 ? "Falta 1 día" : "Faltan " + dias + " días";
  }
}
$("go").addEventListener("click", function(e){ if (this.classList.contains("locked")){ e.preventDefault(); this.classList.remove("shake"); void this.offsetWidth; this.classList.add("shake"); } });
paintGo();
document.getElementById("u").textContent = INVITACION;
var made = false;
function view(){
  var q = location.hash === "#qr";
  document.body.classList.toggle("qrmode", q);
  if (q && !made){
    made = true;
    try {
      new QRCode(document.getElementById("qr"), {text: INVITACION, width: 230, height: 230, colorDark: "#4a0a14", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M});
    } catch (e) { document.getElementById("qr").textContent = "No se pudo generar el QR"; }
  }
}
window.addEventListener("hashchange", function(){ view(); paintGo(); }); view();

var c = document.getElementById("snow"), x = c.getContext("2d"), f = [];
function size(){ c.width = innerWidth; c.height = innerHeight; }
size(); addEventListener("resize", size);
for (var i = 0; i < 60; i++) f.push({x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 2.5 + .8, v: Math.random() * .8 + .3, d: Math.random() * 6});
(function loop(){
  x.clearRect(0, 0, c.width, c.height); x.fillStyle = "rgba(255,255,255,.8)";
  f.forEach(function(p){
    p.y += p.v; p.d += .01; p.x += Math.sin(p.d) * .4;
    if (p.y > c.height) { p.y = -5; p.x = Math.random() * c.width; }
    x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill();
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
